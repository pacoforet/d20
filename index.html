<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>D20</title>

  <!-- PWA & Mobile Web App Settings for iPhone / Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="D20">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0c0d10">

  <!-- Apple Touch Icon (180x180 PNG for iOS Home Screen) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon & Web App Manifest -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.json">

  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0d10;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-dim: #717682;
      --accent-gold: #e5b95f;
      --accent-red: #e05252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background-color: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Minimal Top Navigation */
    #top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      opacity: 0.85;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .btn-minimal {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-minimal:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn-minimal:active {
      transform: scale(0.92);
    }

    /* Subtle History Tracker */
    #history-row {
      position: absolute;
      top: calc(env(safe-area-inset-top, 20px) + 54px);
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .hist-item {
      opacity: 0.45;
      transition: opacity 0.3s ease;
    }

    .hist-item:first-child {
      opacity: 1;
      color: var(--text);
      font-weight: 600;
    }

    .hist-item.nat20 {
      color: var(--accent-gold);
    }

    .hist-item.nat1 {
      color: var(--accent-red);
    }

    /* Minimal Result Display */
    #result-container {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 15;
      text-align: center;
    }

    #result-number {
      font-size: 7.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--text);
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      font-variant-numeric: tabular-nums;
    }

    #result-number.show {
      opacity: 0.95;
      transform: scale(1);
    }

    #result-label {
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s ease 0.08s;
      color: var(--text-dim);
    }

    #result-label.show {
      opacity: 0.9;
    }

    #result-label.gold {
      color: var(--accent-gold);
    }

    #result-label.red {
      color: var(--accent-red);
    }

    /* Minimal Bottom Action Pill */
    #bottom-bar {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 24px) + 20px);
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    #roll-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 44px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    #roll-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    #roll-pill:active {
      transform: scale(0.96);
    }

    #hint {
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      opacity: 0.7;
    }

    /* Minimal Theme Menu */
    #theme-popover {
      position: absolute;
      top: calc(env(safe-area-inset-top, 20px) + 48px);
      right: 20px;
      background: rgba(18, 20, 26, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-width: 140px;
    }

    #theme-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .theme-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-dim);
      transition: all 0.15s ease;
    }

    .theme-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .theme-item.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Subtle ambient flash for 20/1 */
    #ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      z-index: 5;
      transition: opacity 0.6s ease;
    }

    #ambient-glow.gold {
      background: radial-gradient(circle at center, rgba(229, 185, 95, 0.15) 0%, transparent 65%);
      opacity: 1;
    }

    #ambient-glow.red {
      background: radial-gradient(circle at center, rgba(224, 82, 82, 0.15) 0%, transparent 65%);
      opacity: 1;
    }
  </style>

<body>

  <!-- Recent Rolls Row -->
  <div id="history-row"></div>

  <!-- Center Result Overlay -->
  <div id="result-container">

  <div id="canvas-container"></div>

  <script>
    /* ==========================================================================
       TACTILE ACOUSTIC AUDIO ENGINE (Zero Assets, Muted Minimalist Acoustic Clicks)
       ========================================================================== */
    class MinimalAudio {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem('d20_muted') === 'true';
        this.lastTime = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.muted = !this.muted;
        localStorage.setItem('d20_muted', this.muted);
        return !this.muted;
      }

      // Dry, realistic ceramic/resin impact clack
      hit(velocity) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        if (now - this.lastTime < 0.04) return;
        this.lastTime = now;

        const vol = Math.min(0.8, Math.max(0.04, velocity / 14));
        const freq = 1200 + Math.random() * 300;

        // Transient click
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.025);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(freq, now);
        filter.Q.setValueAtTime(5.0, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol * 0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        // Desk mat thud
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.05);

        oscGain.gain.setValueAtTime(vol * 0.35, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

      // Quiet, elegant chime for Nat 20
      nat20() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        [587.33, 880.00].forEach((f, i) => { // D5, A5
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + i * 0.1;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);

          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.18, t + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.75);
        });
      }
    }

    /* ==========================================================================
       MINIMALIST THEMES (Architectural, Matte, Refined)
       ========================================================================== */
    const THEMES = {
      obsidian: {
        bodyColor: '#181a20',
        strokeColor: '#101115',
        textColor: '#f3f4f6',
        roughness: 0.28,
        metalness: 0.05,
        clearcoat: 0.45
      },
      alabaster: {
        bodyColor: '#e8e6df',
        strokeColor: '#d6d3c8',
        textColor: '#18191c',
        roughness: 0.32,
        metalness: 0.02,
        clearcoat: 0.35
      },
      bordeaux: {
        bodyColor: '#3c1217',
        strokeColor: '#25070b',
        textColor: '#f7ede8',
        roughness: 0.26,
        metalness: 0.06,
        clearcoat: 0.5
      },
      sage: {
        bodyColor: '#202e26',
        strokeColor: '#131e17',
        textColor: '#edf3ee',
        roughness: 0.3,
        metalness: 0.04,
        clearcoat: 0.4
      }
    };

    /* ==========================================================================
       CORE 3D & PHYSICS ENGINE
       ========================================================================== */
    const RADIUS = 1.85;
    let scene, camera, renderer, world, clock;
    let diceBody, diceMesh;
    let isRolling = false;
    let rollStartTime = 0;
    let currentThemeKey = localStorage.getItem('d20_theme') || 'obsidian';
    let currentTheme = THEMES[currentThemeKey] || THEMES.obsidian;
    const audio = new MinimalAudio();
    let history = [];
    let faceNumberMapping = [];

    // Pointer gesture
    let pointerStart = null;
    let pointerStartTime = 0;

    // Elements
    const resultNumEl = document.getElementById('result-number');
    const resultLabelEl = document.getElementById('result-label');
    const historyRowEl = document.getElementById('history-row');
    const glowEl = document.getElementById('ambient-glow');
    const soundBtn = document.getElementById('sound-btn');
    const themeBtn = document.getElementById('theme-btn');
    const themePopover = document.getElementById('theme-popover');
    const rollPill = document.getElementById('roll-pill');

    /* --- Texture Generation (Crisp Modern Debossed Typography) --- */
    function createFaceCanvas(number, theme, polyPts) {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const cx = size / 2;
      const cy = size / 2;

      // Base Facet Color
      ctx.fillStyle = theme.bodyColor;
      ctx.fillRect(0, 0, size, size);

      // Convert UV polyPts to canvas space (Y flipped)
      const pts = polyPts.map(p => ({
        x: p.u * size,
        y: (1 - p.v) * size
      }));

      // Subtle Facet Chamfer Border
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[1].x, pts[1].y);
      ctx.lineTo(pts[2].x, pts[2].y);
      ctx.closePath();
      ctx.strokeStyle = theme.strokeColor;
      ctx.lineWidth = 14;
      ctx.stroke();

      // Clean Modern Debossed Number (Inter font)
      ctx.font = '700 155px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Subtle deboss shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillText(number.toString(), cx, cy + 20);

      // Clean Top Rim
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillText(number.toString(), cx, cy + 14);

      // Main Text Fill
      ctx.fillStyle = theme.textColor;
      ctx.fillText(number.toString(), cx, cy + 17);

      // Discreet dot for 6 and 9
      if (number === 6 || number === 9) {
        ctx.beginPath();
        ctx.arc(cx, cy + 78, 6, 0, Math.PI * 2);
        ctx.fillStyle = theme.textColor;
        ctx.fill();
      }

      return canvas;
    }

    /* --- D20 Geometry Setup --- */
    function setupD20Mesh(theme) {
      if (diceMesh) {
        scene.remove(diceMesh);
      }

      const geo = new THREE.IcosahedronGeometry(RADIUS, 0);
      const pos = geo.attributes.position;

      // Identify 20 face centers and normals
      const faceNormals = [];
      for (let f = 0; f < 20; f++) {
        const i3 = f * 3;
        const vA = new THREE.Vector3().fromBufferAttribute(pos, i3);
        const vB = new THREE.Vector3().fromBufferAttribute(pos, i3 + 1);
        const vC = new THREE.Vector3().fromBufferAttribute(pos, i3 + 2);
        const center = new THREE.Vector3().add(vA).add(vB).add(vC).divideScalar(3);
        const normal = center.clone().normalize();
        faceNormals.push({ index: f, center, normal, paired: false });
      }

      // Standard D20 pairings (sum to 21)
      const pairs = [
        [20, 1], [19, 2], [18, 3], [17, 4], [16, 5],
        [15, 6], [14, 7], [13, 8], [12, 9], [11, 10]
      ];

      faceNumberMapping = new Array(20);
      let pairIdx = 0;

      for (let i = 0; i < 20; i++) {
        if (faceNormals[i].paired) continue;

        let bestOpp = -1;
        let minDot = 1.0;
        for (let j = i + 1; j < 20; j++) {
          if (!faceNormals[j].paired) {
            const dot = faceNormals[i].normal.dot(faceNormals[j].normal);
            if (dot < minDot) {
              minDot = dot;
              bestOpp = j;
            }
          }
        }

        faceNormals[i].paired = true;
        faceNumberMapping[i] = pairs[pairIdx][0];

        if (bestOpp !== -1) {
          faceNormals[bestOpp].paired = true;
          faceNumberMapping[bestOpp] = pairs[pairIdx][1];
        }
        pairIdx++;
      }

      // Upright UVs and materials
      const materials = [];
      const uvs = [];

      for (let f = 0; f < 20; f++) {
        const num = faceNumberMapping[f];
        const i3 = f * 3;
        const vA = new THREE.Vector3().fromBufferAttribute(pos, i3);
        const vB = new THREE.Vector3().fromBufferAttribute(pos, i3 + 1);
        const vC = new THREE.Vector3().fromBufferAttribute(pos, i3 + 2);
        const n = faceNormals[f].normal;

        let wUp = new THREE.Vector3(0, 1, 0);
        if (Math.abs(n.dot(wUp)) > 0.95) {
          wUp = new THREE.Vector3(0, 0, 1);
        }

        const vUp = new THREE.Vector3().subVectors(wUp, n.clone().multiplyScalar(wUp.dot(n))).normalize();
        const vRight = new THREE.Vector3().crossVectors(vUp, n).normalize();

        const center = faceNormals[f].center;
        const rawPts = [vA, vB, vC].map(p => {
          const rel = new THREE.Vector3().subVectors(p, center);
          return { x: rel.dot(vRight), y: rel.dot(vUp) };
        });

        const maxDist = Math.max(...rawPts.map(p => Math.hypot(p.x, p.y))) || 1;
        const uvScale = 0.44;

        const faceUVs = rawPts.map(p => ({
          u: 0.5 + (p.x / maxDist) * uvScale,
          v: 0.5 + (p.y / maxDist) * uvScale
        }));

        faceUVs.forEach(p => uvs.push(p.u, p.v));

        const canvas = createFaceCanvas(num, theme, faceUVs);
        const map = new THREE.CanvasTexture(canvas);
        map.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const mat = new THREE.MeshPhysicalMaterial({
          map: map,
          roughness: theme.roughness,
          metalness: theme.metalness,
          clearcoat: theme.clearcoat,
          clearcoatRoughness: 0.1
        });
        materials.push(mat);

        geo.addGroup(f * 3, 3, f);
      }

      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.computeVertexNormals();

      diceMesh = new THREE.Mesh(geo, materials);
      diceMesh.castShadow = true;
      diceMesh.receiveShadow = true;
      scene.add(diceMesh);
    }

    /* --- Physics Setup with Reliable Bounding Boxes --- */
    function setupPhysics() {
      world = new CANNON.World();
      world.gravity.set(0, -34, 0);
      world.allowSleep = true;

      const surfaceMat = new CANNON.Material('surface');
      const diceMat = new CANNON.Material('dice');
      world.addContactMaterial(new CANNON.ContactMaterial(surfaceMat, diceMat, {
        friction: 0.38,
        restitution: 0.48
      }));

      // 1. Table Floor Plane (Infinite at y=0)
      const floorBody = new CANNON.Body({ mass: 0, material: surfaceMat });
      floorBody.addShape(new CANNON.Plane());
      floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
      world.addBody(floorBody);

      // 2. Finite Bounding Box Walls (keeps die safely on screen without trapping it)
      const wallH = 10;
      const wallThick = 1;
      const bound = 5.2;

      function createWall(x, z, hx, hz) {
        const wall = new CANNON.Body({ mass: 0, material: surfaceMat });
        wall.addShape(new CANNON.Box(new CANNON.Vec3(hx, wallH, hz)));
        wall.position.set(x, wallH, z);
        world.addBody(wall);
      }

      createWall(0, -bound, bound, wallThick); // North
      createWall(0, bound, bound, wallThick);  // South
      createWall(-bound, 0, wallThick, bound); // West
      createWall(bound, 0, wallThick, bound);  // East

      // 3. Convex Polyhedron for D20
      const baseGeo = new THREE.IcosahedronGeometry(RADIUS, 0);
      const pos = baseGeo.attributes.position.array;
      const vertices = [];
      for (let i = 0; i < pos.length; i += 3) {
        vertices.push(new CANNON.Vec3(pos[i], pos[i + 1], pos[i + 2]));
      }

      const faces = [];
      for (let i = 0; i < pos.length / 9; i++) {
        faces.push([i * 3, i * 3 + 1, i * 3 + 2]);
      }

      const shape = new CANNON.ConvexPolyhedron({ vertices, faces });
      diceBody = new CANNON.Body({
        mass: 3.2,
        material: diceMat,
        linearDamping: 0.2,
        angularDamping: 0.2
      });
      diceBody.addShape(shape);
      world.addBody(diceBody);

      // Collision Audio
      diceBody.addEventListener('collide', (e) => {
        const impact = e.contact.getImpactVelocityAlongNormal();
        if (impact > 0.4) {
          audio.hit(impact);
          if (navigator.vibrate && impact > 4) {
            navigator.vibrate(10);
          }
        }
      });
    }

    /* --- Clean Minimalist Surface & Lights --- */
    function setupScene() {
      // Soft Floor Shadow Plane
      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 30),
        new THREE.ShadowMaterial({ opacity: 0.28 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = 0.001;
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      // Soft ambient light
      const ambient = new THREE.AmbientLight(0xffffff, 0.72);
      scene.add(ambient);

      // Primary Key Light with soft shadow
      const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
      keyLight.position.set(6, 14, 7);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 1;
      keyLight.shadow.camera.far = 30;
      keyLight.shadow.camera.left = -6;
      keyLight.shadow.camera.right = 6;
      keyLight.shadow.camera.top = 6;
      keyLight.shadow.camera.bottom = -6;
      keyLight.shadow.bias = -0.0004;
      keyLight.shadow.radius = 2;
      scene.add(keyLight);

      // Subtle cool fill light
      const fillLight = new THREE.DirectionalLight(0xdce7f5, 0.35);
      fillLight.position.set(-6, 8, -5);
      scene.add(fillLight);
    }

    /* --- Init Routine --- */
    function init() {
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 10.5, 9.5);
      camera.lookAt(0, 0.4, 0);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      setupScene();
      setupPhysics();
      setupD20Mesh(currentTheme);
      setupListeners();

      soundBtn.innerText = audio.muted ? '🔇' : '🔊';

      // Initial roll
      roll();

      animate();
    }

    /* --- Roll Mechanics --- */
    function roll(impulseX = 0, impulseZ = 0) {
      audio.init();

      resultNumEl.classList.remove('show');
      resultLabelEl.classList.remove('show');
      glowEl.className = '';

      isRolling = true;
      rollStartTime = performance.now();

      // Spawn in center camera view
      const sx = (Math.random() - 0.5) * 1.2;
      const sz = (Math.random() - 0.5) * 1.2;
      diceBody.position.set(sx, 4.8 + Math.random() * 0.8, sz);

      const vx = impulseX ? impulseX * 0.035 : (Math.random() - 0.5) * 6;
      const vz = impulseZ ? impulseZ * 0.035 : (Math.random() - 0.5) * 6;
      diceBody.velocity.set(vx, -4.5 - Math.random() * 1.5, vz);

      diceBody.angularVelocity.set(
        (Math.random() - 0.5) * 32,
        (Math.random() - 0.5) * 32,
        (Math.random() - 0.5) * 32
      );

      diceBody.wakeUp();

      if (navigator.vibrate) {
        navigator.vibrate(12);
      }
    }

    function detectTopFace() {
      const up = new THREE.Vector3(0, 1, 0);
      let maxDot = -Infinity;
      let winningFace = 1;

      const normalMatrix = new THREE.Matrix3().getNormalMatrix(diceMesh.matrixWorld);
      const posAttr = diceMesh.geometry.attributes.position;

      for (let f = 0; f < 20; f++) {
        const i3 = f * 3;
        const vA = new THREE.Vector3().fromBufferAttribute(posAttr, i3);
        const vB = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 1);
        const vC = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 2);

        const center = new THREE.Vector3().add(vA).add(vB).add(vC).divideScalar(3);
        const normal = center.clone().normalize().applyMatrix3(normalMatrix).normalize();

        const dot = normal.dot(up);
        if (dot > maxDot) {
          maxDot = dot;
          winningFace = faceNumberMapping[f];
        }
      }

      return winningFace;
    }

    function onDiceRest(result) {
      isRolling = false;

      resultNumEl.innerText = result;
      resultNumEl.classList.add('show');

      resultLabelEl.className = '';
      if (result === 20) {
        resultLabelEl.innerText = 'Natural 20';
        resultLabelEl.classList.add('gold', 'show');
        glowEl.className = 'gold';
        audio.nat20();
        if (navigator.vibrate) navigator.vibrate([40, 40, 60]);
      } else if (result === 1) {
        resultLabelEl.innerText = 'Critical 1';
        resultLabelEl.classList.add('red', 'show');
        glowEl.className = 'red';
        if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
      } else {
        resultLabelEl.innerText = '';
        if (navigator.vibrate) navigator.vibrate(20);
      }

      setTimeout(() => { glowEl.className = ''; }, 700);

      updateHistory(result);
    }

    function updateHistory(val) {
      history.unshift(val);
      if (history.length > 5) history.pop();

      historyRowEl.innerHTML = history.map((item, idx) => {
        let cls = 'hist-item';
        if (item === 20) cls += ' nat20';
        if (item === 1) cls += ' nat1';
        return `<span class="${cls}">${item}</span>`;
      }).join(' · ');
    }

    /* --- Listeners --- */
    function setupListeners() {
      const container = document.getElementById('canvas-container');

      // Swipe / Drag to roll
      container.addEventListener('pointerdown', (e) => {
        pointerStart = { x: e.clientX, y: e.clientY };
        pointerStartTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (!pointerStart) return;

        const dx = e.clientX - pointerStart.x;
        const dy = e.clientY - pointerStart.y;
        const dt = Math.max(10, performance.now() - pointerStartTime);
        pointerStart = null;

        const dist = Math.hypot(dx, dy);
        if (dist > 30 && dt < 400) {
          const sx = (dx / dt) * 60;
          const sz = (dy / dt) * 60;
          roll(sx, sz);
        } else {
          roll();
        }
      });

      // Roll Button
      rollPill.addEventListener('click', (e) => {
        e.stopPropagation();
        roll();
      });

      // Spacebar
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          roll();
        }
      });

      // Sound toggle
      soundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const unmuted = audio.toggle();
        soundBtn.innerText = unmuted ? '🔊' : '🔇';
      });

      // Theme toggle
      themeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        themePopover.classList.toggle('open');
      });

      document.querySelectorAll('.theme-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const k = item.dataset.theme;
          if (THEMES[k]) {
            currentThemeKey = k;
            currentTheme = THEMES[k];
            localStorage.setItem('d20_theme', k);

            document.querySelectorAll('.theme-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');

            setupD20Mesh(currentTheme);
            themePopover.classList.remove('open');
            roll();
          }
        });
      });

      window.addEventListener('click', () => {
        themePopover.classList.remove('open');
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    /* --- Render & Physics Loop --- */
    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      world.step(1 / 60, delta, 3);

      // Safety: keep die bounded
      if (Math.abs(diceBody.position.x) > 6 || Math.abs(diceBody.position.z) > 6 || diceBody.position.y > 10) {
        diceBody.position.set(0, 4.5, 0);
        diceBody.velocity.set(0, -2, 0);
      }

      // Sync 3D Mesh
      diceMesh.position.copy(diceBody.position);
      diceMesh.quaternion.copy(diceBody.quaternion);

      // Rest Detection
      if (isRolling) {
        const speed = diceBody.velocity.length();
        const angSpeed = diceBody.angularVelocity.length();
        const elapsed = performance.now() - rollStartTime;

        if (
          (speed < 0.08 && angSpeed < 0.08 && diceBody.position.y < RADIUS + 0.35 && elapsed > 700) ||
          (elapsed > 3500 && speed < 0.2)
        ) {
          const res = detectTopFace();
          onDiceRest(res);
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = init;

    // Service Worker for iPhone / PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('SW note:', err);
        });
      });
    }

    // Prevent iOS rubber-banding
    document.addEventListener('touchmove', (e) => {
      if (e.target.tagName !== 'BUTTON' && !e.target.closest('#theme-popover')) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
