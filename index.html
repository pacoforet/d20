    :root {
      --bg-dark: #090b10;
      --gold-primary: #f6c85f;

    * {

      -webkit-touch-callout: none;

    body, html {

      top: 0;
      left: 0;

      cursor: grab;
      touch-action: none;

      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

    }

    .brand {

      gap: 10px;

      font-size: 1.1rem;

      letter-spacing: 1.2px;
      color: var(--gold-primary);

    .brand span {

      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-left: 2px;

    .controls-cluster {

      position: absolute;

      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
      padding: 0 16px;

      min-width: 34px;

      display: flex;

  <script>
    /* ==========================================================================
       D20 AUDIO ENGINE (Synthesized via Web Audio API - Zero External Dependencies)
       ========================================================================== */
    class DiceAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem('d20_muted') === 'true';
        this.lastSoundTime = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('d20_muted', this.muted);
        return !this.muted;
      }

      // Realistic plastic/acrylic dice clatter sound
      playHit(velocity) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        if (now - this.lastSoundTime < 0.04) return;
        this.lastSoundTime = now;

        const volume = Math.min(1.0, Math.max(0.06, velocity / 12));
        const pitch = 1350 + Math.random() * 450 + (velocity * 20);

        // Sharp acrylic click transient
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.035);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.22));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(pitch, now);
        filter.Q.setValueAtTime(5.5, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(volume * 0.65, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        // Table surface resonance thud
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220 + Math.random() * 60, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.07);

        oscGain.gain.setValueAtTime(volume * 0.45, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.075);
      }

      // Natural 20 Triumphant Fanfare
      playNat20() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 - E5 - G5 - C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = this.ctx.currentTime + (idx * 0.09);

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.28, start + 0.035);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.65);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.7);
        });
      }

      // Natural 1 Critical Fail Thud
      playNat1() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);

        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.52);
      }
    }

    const THEMES = {

    /* --- Dynamic Face Texture Generator with Exact Projected Vertex Boundaries --- */
    function createFaceCanvas(number, theme, polyPoints, isBump = false) {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const cx = size / 2;
      const cy = size / 2;

      // Convert UV polyPoints (0..1) to Canvas pixel coordinates (0..512)
      // Note: canvas Y is inverted relative to UV V (V=1 is Y=0)
      const pts = polyPoints.map(p => ({
        x: p.u * size,
        y: (1 - p.v) * size
      }));

      if (isBump) {
        // Neutral gray for bump base
        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, size, size);

        // Recessed triangle face
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.closePath();
        ctx.fillStyle = '#6e6e6e';
        ctx.fill();

        // Engraved deep groove for number
        ctx.font = '900 145px "Cinzel", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#222222';
        ctx.fillText(number.toString(), cx, cy + 18);

        if (number === 6 || number === 9) {
          ctx.fillRect(cx - 36, cy + 88, 72, 10);
        }
      } else {
        // 1. Swirled Gemstone Gradient Base
        const grad = ctx.createRadialGradient(cx, cy * 0.75, 15, cx, cy, size * 0.55);
        grad.addColorStop(0, theme.bgLight);
        grad.addColorStop(0.6, theme.bgMid);
        grad.addColorStop(1, theme.bgDark);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        // Marble veins
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(Math.random() * size, 0);
          ctx.bezierCurveTo(Math.random() * size, size * 0.4, Math.random() * size, size * 0.6, Math.random() * size, size);
          ctx.stroke();
        }

        // 2. Exact Triangle Face Border (matches 3D facets seamlessly)
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.closePath();

        ctx.strokeStyle = theme.stroke;
        ctx.lineWidth = 18;
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 4;
        ctx.stroke();

        // 3. Engraved Metallic Leaf Typography
        ctx.font = '900 145px "Cinzel", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Deep shadow for engraved look
        ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
        ctx.fillText(number.toString(), cx, cy + 22);

        // Top-edge light catch
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillText(number.toString(), cx, cy + 14);

        // Main Metallic Fill
        ctx.fillStyle = theme.numberColor;
        ctx.fillText(number.toString(), cx, cy + 18);

        // Underline identifier for 6 and 9
        if (number === 6 || number === 9) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(cx - 36, cy + 90, 72, 10);
          ctx.fillStyle = theme.numberColor;
          ctx.fillRect(cx - 36, cy + 87, 72, 9);
        }
      }

      return canvas;
    }

    /* --- Procedural Studio Lighting Environment --- */
    function createStudioEnvironment() {
      const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
      const cubeCamera = new THREE.CubeCamera(0.1, 50, cubeRenderTarget);
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x131620);

      // Overhead softbox panel
      const topLight = new THREE.Mesh(
        new THREE.PlaneGeometry(18, 18),
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
      );
      topLight.position.set(0, 10, 0);
      topLight.rotation.x = Math.PI / 2;
      envScene.add(topLight);

      // Warm side panel
      const warmLight = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffedd5, side: THREE.DoubleSide })
      );
      warmLight.position.set(9, 4, 8);
      warmLight.lookAt(0, 0, 0);
      envScene.add(warmLight);

      // Cool rim panel
      const coolLight = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 12),
        new THREE.MeshBasicMaterial({ color: 0x93c5fd, side: THREE.DoubleSide })
      );
      coolLight.position.set(-9, 3, -8);
      coolLight.lookAt(0, 0, 0);
      envScene.add(coolLight);

      cubeCamera.update(renderer, envScene);
      return cubeRenderTarget.texture;
    }

    /* --- D20 Geometry, Opposite Pair Matching & UV Construction --- */
    function setupD20Mesh(theme) {
      if (diceMesh) {
        scene.remove(diceMesh);
      }

      const baseGeo = new THREE.IcosahedronGeometry(RADIUS, 0);
      const nonIndexed = baseGeo.toNonIndexed();
      const posAttr = nonIndexed.attributes.position;

      // 1. Gather all 20 face centers and normals
      const faceNormals = [];
      for (let f = 0; f < 20; f++) {
        const i3 = f * 3;
        const vA = new THREE.Vector3().fromBufferAttribute(posAttr, i3);
        const vB = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 1);
        const vC = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 2);
        const center = new THREE.Vector3().add(vA).add(vB).add(vC).divideScalar(3);
        const normal = center.clone().normalize();
        faceNormals.push({ index: f, center, normal, paired: false });
      }

      // Pair opposite faces (sum to 21)
      const pairs = [
        [20, 1], [19, 2], [18, 3], [17, 4], [16, 5],
        [15, 6], [14, 7], [13, 8], [12, 9], [11, 10]
      ];

      faceNumberMapping = new Array(20);
      let pairIdx = 0;

      for (let i = 0; i < 20; i++) {
        if (faceNormals[i].paired) continue;

        let bestOpp = -1;
        let minDot = 1.0;
        for (let j = i + 1; j < 20; j++) {
          if (!faceNormals[j].paired) {
            const dot = faceNormals[i].normal.dot(faceNormals[j].normal);
            if (dot < minDot) {
              minDot = dot;
              bestOpp = j;
            }
          }
        }

        faceNormals[i].paired = true;
        faceNumberMapping[i] = pairs[pairIdx][0];

        if (bestOpp !== -1) {
          faceNormals[bestOpp].paired = true;
          faceNumberMapping[bestOpp] = pairs[pairIdx][1];
        }
        pairIdx++;
      }

      // 2. Construct UVs and materials with upright orientation
      const materials = [];
      const uvs = [];

      for (let f = 0; f < 20; f++) {
        const num = faceNumberMapping[f];
        const i3 = f * 3;
        const vA = new THREE.Vector3().fromBufferAttribute(posAttr, i3);
        const vB = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 1);
        const vC = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 2);
        const n = faceNormals[f].normal;

        // Calculate face local 2D coordinate system
        let wUp = new THREE.Vector3(0, 1, 0);
        if (Math.abs(n.dot(wUp)) > 0.95) {
          wUp = new THREE.Vector3(0, 0, 1);
        }

        const vUp = new THREE.Vector3().subVectors(wUp, n.clone().multiplyScalar(wUp.dot(n))).normalize();
        const vRight = new THREE.Vector3().crossVectors(vUp, n).normalize();

        const center = faceNormals[f].center;
        const rawPts = [vA, vB, vC].map(p => {
          const rel = new THREE.Vector3().subVectors(p, center);
          return { x: rel.dot(vRight), y: rel.dot(vUp) };
        });

        const maxDist = Math.max(...rawPts.map(p => Math.hypot(p.x, p.y))) || 1;
        const uvScale = 0.44;

        // Calculate exact UVs for vertices
        const faceUVs = rawPts.map(p => ({
          u: 0.5 + (p.x / maxDist) * uvScale,
          v: 0.5 + (p.y / maxDist) * uvScale
        }));

        faceUVs.forEach(p => {
          uvs.push(p.u, p.v);
        });

        // Generate customized canvas for this exact triangle geometry
        const faceCanvas = createFaceCanvas(num, theme, faceUVs, false);
        const bumpCanvas = createFaceCanvas(num, theme, faceUVs, true);

        const mapTex = new THREE.CanvasTexture(faceCanvas);
        const bumpTex = new THREE.CanvasTexture(bumpCanvas);

        const mat = new THREE.MeshPhysicalMaterial({
          map: mapTex,
          bumpMap: bumpTex,
          bumpScale: 0.05,
          roughness: theme.roughness,
          metalness: theme.metalness,
          clearcoat: theme.clearcoat,
          clearcoatRoughness: theme.clearcoatRoughness,
          reflectivity: 0.95
        });
        materials.push(mat);

        nonIndexed.addGroup(f * 3, 3, f);
      }

      nonIndexed.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      nonIndexed.computeVertexNormals();

      diceMesh = new THREE.Mesh(nonIndexed, materials);
      diceMesh.castShadow = true;
      diceMesh.receiveShadow = true;
      scene.add(diceMesh);
    }

    /* --- Cannon-es Physics World --- */
    function setupPhysics() {
      world = new CANNON.World();
      world.gravity.set(0, -38, 0);
      world.allowSleep = true;

      const feltMat = new CANNON.Material('felt');
      const diceMat = new CANNON.Material('dice');
      const contactMat = new CANNON.ContactMaterial(feltMat, diceMat, {
        friction: 0.35,
        restitution: 0.52
      });
      world.addContactMaterial(contactMat);

      // Floor
      const floorBody = new CANNON.Body({ mass: 0, material: feltMat });
      floorBody.addShape(new CANNON.Plane());
      floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
      world.addBody(floorBody);

      // Cylindrical tray boundaries
      const wallSegments = 12;
      const trayRadius = 5.2;
      for (let i = 0; i < wallSegments; i++) {
        const angle = (i / wallSegments) * Math.PI * 2;
        const wx = Math.cos(angle) * trayRadius;
        const wz = Math.sin(angle) * trayRadius;

        const wallBody = new CANNON.Body({ mass: 0, material: feltMat });
        wallBody.addShape(new CANNON.Plane());
        wallBody.position.set(wx, 0, wz);
        wallBody.quaternion.setFromEuler(0, angle + Math.PI, 0);
        world.addBody(wallBody);
      }

      // Cannon Convex Polyhedron for D20
      const baseGeo = new THREE.IcosahedronGeometry(RADIUS, 0);
      const pos = baseGeo.attributes.position.array;
      const vertices = [];
      for (let i = 0; i < pos.length; i += 3) {
        vertices.push(new CANNON.Vec3(pos[i], pos[i + 1], pos[i + 2]));
      }

      const faces = [];
      for (let i = 0; i < pos.length / 9; i++) {
        faces.push([i * 3, i * 3 + 1, i * 3 + 2]);
      }

      const shape = new CANNON.ConvexPolyhedron({ vertices, faces });
      diceBody = new CANNON.Body({
        mass: 3.5,
        material: diceMat,
        linearDamping: 0.22,
        angularDamping: 0.22
      });
      diceBody.addShape(shape);
      world.addBody(diceBody);

      // Collision Audio Event
      diceBody.addEventListener('collide', (e) => {
        const impact = e.contact.getImpactVelocityAlongNormal();
        if (impact > 0.4) {
          audioEngine.playHit(impact);
          if (navigator.vibrate && impact > 3.0) {
            navigator.vibrate(8);
          }
        }
      });
    }

    /* --- Visual Tabletop Tray --- */
    function createDiceTray() {
      // Felt Floor
      const floorGeo = new THREE.CylinderGeometry(5.4, 5.4, 0.2, 48);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x10131d,
        roughness: 0.85,
        metalness: 0.05
      });
      const trayFloor = new THREE.Mesh(floorGeo, floorMat);
      trayFloor.position.y = -0.1;
      trayFloor.receiveShadow = true;
      scene.add(trayFloor);

      // Subtle Decorative Ring Accent
      const ringGeo = new THREE.RingGeometry(5.0, 5.15, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x22293d,
        side: THREE.DoubleSide
      });
      const innerRing = new THREE.Mesh(ringGeo, ringMat);
      innerRing.rotation.x = -Math.PI / 2;
      innerRing.position.y = 0.005;
      scene.add(innerRing);

      // Mahogany/Dark Brass Rim
      const rimGeo = new THREE.TorusGeometry(5.35, 0.28, 16, 64);
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0x241711,
        metalness: 0.4,
        roughness: 0.35
      });
      const rimMesh = new THREE.Mesh(rimGeo, rimMat);
      rimMesh.rotation.x = Math.PI / 2;
      rimMesh.position.y = 0.15;
      rimMesh.castShadow = true;
      rimMesh.receiveShadow = true;
      scene.add(rimMesh);
    }

    /* --- Initialization --- */
    function init() {
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 11, 10);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // Studio Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.55);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.4);
      keyLight.position.set(6, 16, 7);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 2;
      keyLight.shadow.camera.far = 28;
      keyLight.shadow.camera.left = -6;
      keyLight.shadow.camera.right = 6;
      keyLight.shadow.camera.top = 6;
      keyLight.shadow.camera.bottom = -6;
      keyLight.shadow.bias = -0.0004;
      scene.add(keyLight);

      const rimLight = new THREE.PointLight(0xa5c4fc, 1.1, 30);
      rimLight.position.set(-7, 6, -6);
      scene.add(rimLight);

      // Studio Environment Map
      scene.environment = createStudioEnvironment();

      // Physics, Tray & Mesh
      setupPhysics();
      createDiceTray();
      setupD20Mesh(currentTheme);

      // Setup Inputs
      setupInteractions();

      // Sound button status
      soundBtn.innerText = audioEngine.muted ? '🔇' : '🔊';

      // Initial roll
      throwDice();

      animate();
    }

    /* --- Interactive Throwing Mechanics --- */
    function throwDice(impulseX = 0, impulseZ = 0) {
      audioEngine.init();

      resultNumberEl.classList.remove('show');
      resultBadgeEl.classList.remove('show');
      fxFlashEl.className = '';

      isRolling = true;
      rollStartTime = performance.now();

      const spawnX = (Math.random() - 0.5) * 1.5;
      const spawnZ = (Math.random() - 0.5) * 1.5;
      diceBody.position.set(spawnX, 7.5 + Math.random() * 1.5, spawnZ);

      const vx = impulseX ? impulseX * 0.04 : (Math.random() - 0.5) * 7;
      const vz = impulseZ ? impulseZ * 0.04 : (Math.random() - 0.5) * 7;
      diceBody.velocity.set(vx, -5.5 - Math.random() * 2, vz);

      diceBody.angularVelocity.set(
        (Math.random() - 0.5) * 38,
        (Math.random() - 0.5) * 38,
        (Math.random() - 0.5) * 38
      );

      diceBody.wakeUp();

      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    function detectTopFace() {
      const up = new THREE.Vector3(0, 1, 0);
      let maxDot = -Infinity;
      let winningFace = 1;

      const normalMatrix = new THREE.Matrix3().getNormalMatrix(diceMesh.matrixWorld);
      const posAttr = diceMesh.geometry.attributes.position;

      for (let f = 0; f < 20; f++) {
        const i3 = f * 3;
        const vA = new THREE.Vector3().fromBufferAttribute(posAttr, i3);
        const vB = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 1);
        const vC = new THREE.Vector3().fromBufferAttribute(posAttr, i3 + 2);

        const center = new THREE.Vector3().add(vA).add(vB).add(vC).divideScalar(3);
        const normal = center.clone().normalize().applyMatrix3(normalMatrix).normalize();

        const dot = normal.dot(up);
        if (dot > maxDot) {
          maxDot = dot;
          winningFace = faceNumberMapping[f];
        }
      }

      return winningFace;
    }

    function onDiceRest(result) {
      isRolling = false;

      resultNumberEl.innerText = result;
      resultNumberEl.classList.add('show');

      resultBadgeEl.className = '';
      if (result === 20) {
        resultBadgeEl.innerText = '¡CRÍTICO! NAT 20';
        resultBadgeEl.classList.add('nat20', 'show');
        fxFlashEl.className = 'gold';
        audioEngine.playNat20();
        if (navigator.vibrate) navigator.vibrate([50, 40, 50, 40, 120]);
      } else if (result === 1) {
        resultBadgeEl.innerText = 'PIFIA CRÍTICA (1)';
        resultBadgeEl.classList.add('nat1', 'show');
        fxFlashEl.className = 'red';
        audioEngine.playNat1();
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      } else {
        resultBadgeEl.innerText = 'RESULTADO';
        resultBadgeEl.classList.add('standard', 'show');
        if (navigator.vibrate) navigator.vibrate(25);
      }

      setTimeout(() => {
        fxFlashEl.className = '';
      }, 700);

      addHistory(result);
    }

    function addHistory(num) {
      rollHistory.unshift(num);
      if (rollHistory.length > 5) rollHistory.pop();

      historyContainerEl.innerHTML = '';
      rollHistory.forEach((val, idx) => {
        const pill = document.createElement('div');
        pill.className = 'history-pill';
        if (idx === 0) pill.classList.add('latest');
        if (val === 20) pill.classList.add('nat20');
        if (val === 1) pill.classList.add('nat1');
        pill.innerText = val;
        historyContainerEl.appendChild(pill);
      });
    }

    /* --- Input Handlers --- */
    function setupInteractions() {
      const container = document.getElementById('canvas-container');

      // Swipe / Drag to throw
      container.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
        pointerDownTime = performance.now();
      });

      window.addEventListener('pointerup', (e) => {
        if (!pointerDownPos) return;

        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dt = Math.max(10, performance.now() - pointerDownTime);
        pointerDownPos = null;

        const dist = Math.hypot(dx, dy);
        if (dist > 35 && dt < 450) {
          const speedX = (dx / dt) * 65;
          const speedZ = (dy / dt) * 65;
          throwDice(speedX, speedZ);
        } else {
          throwDice();
        }
      });

      // Roll Button
      rollBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        throwDice();
      });

      // Spacebar
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          throwDice();
        }
      });

      // Sound Toggle
      soundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const unmuted = audioEngine.toggleMute();
        soundBtn.innerText = unmuted ? '🔊' : '🔇';
      });

      // Theme Picker
      themeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        themeMenu.classList.toggle('open');
      });

      document.querySelectorAll('.theme-opt').forEach(opt => {
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          const themeKey = opt.dataset.theme;
          if (THEMES[themeKey]) {
            currentThemeKey = themeKey;
            currentTheme = THEMES[themeKey];
            localStorage.setItem('d20_theme', themeKey);

            document.querySelectorAll('.theme-opt').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            rollBtn.style.background = currentTheme.buttonBg;

            setupD20Mesh(currentTheme);
            themeMenu.classList.remove('open');
            throwDice();
          }
        });
      });

      window.addEventListener('click', () => {
        themeMenu.classList.remove('open');
      });

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* --- Animation & Stepping Loop --- */
    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      // Accurate variable-rate physics step
      world.step(1 / 60, delta, 3);

      // Sync Three.js Mesh with Cannon Body
      diceMesh.position.copy(diceBody.position);
      diceMesh.quaternion.copy(diceBody.quaternion);

      // Resting Detection
      if (isRolling) {
        const speed = diceBody.velocity.length();
        const angSpeed = diceBody.angularVelocity.length();
        const elapsed = performance.now() - rollStartTime;

        if (
          (speed < 0.08 && angSpeed < 0.08 && diceBody.position.y < RADIUS + 0.35 && elapsed > 800) ||
          (elapsed > 3800 && speed < 0.25)
        ) {
          const res = detectTopFace();
          onDiceRest(res);
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
